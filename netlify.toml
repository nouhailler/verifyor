[build]
  command = "npm run build:netlify"
  publish = "dist/netlify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/admin/db"
  to = "/admin-db.html"
  status = 200

[[redirects]]
  from = "/search/db"
  to = "/search-db.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/settings.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
